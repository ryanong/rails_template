  ## Task Execution
  - Follow TDD: write a failing test first, then implement to make it pass, then refactor if needed

rules:
  proposal:
    - Identify which Packwerk package(s) the feature belongs to and confirm no dependency cycle is introduced
    - Include the specific View Components, service objects, and policy objects that will be created or modified
    - Specify where authorization lives (policy class and method name, named after the calling service)
    - Specify Stimulus controllers and Turbo interactions needed
    - Note any database migrations required; include encryption/blind-index needs for any PII columns
    - Describe the service object inputs, result contract
    - Include a "Non-goals" section to keep scope tight
    - Consider mobile-first — describe the mobile experience before desktop
    - Not use strings for user-facing text, including errors; instead, use `I18n.t` with a key in `config/locales/en.yml`
  tasks:
    - Each task should be completable independently with passing tests
    - Order tasks: data layer (models, migrations) first, then service objects and policies, then controllers, then views
    - Include a test task for each implementation task — no code without coverage
    - Keep tasks small enough that each touches at most 3–4 files
    - Specify the exact file paths to create or modify (e.g., `app/services/create_project.rb`)
    - Service tasks must include the `authorize!` call and confirm the corresponding policy method exists
    - Include Sorbet type checking (`srb tc`) as a verification step after each service or model task
    - Run `bin/tapioca dsl` after adding new service objects or models to keep RBI files current
    - Include a final task to run `bin/ci` for full suite validation
  specs:
    - Describe user-facing behavior, not implementation details
    - Identify the persona for each scenario
    - Include mobile and desktop scenarios separately when the experience differs
    - Specify edge cases and error states explicitly
    - Reference existing patterns in the codebase when extending functionality
    - Update files in the `test/` folder with new assertions or tests for the feature being implemented
    - Prefer system tests for happy path user flows; controller tests for edge cases and error states
    - Tag tests with `# @spec <spec-folder>` to link back to the relevant OpenSpec spec
