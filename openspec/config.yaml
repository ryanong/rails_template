schema: spec-driven

context: |
  ## Stack
  - Ruby 4.0.2, Rails 8.1
  - SQLite (via `storage/` directory)
  - Background Jobs: Solid Queue (recurring jobs via `config/recurring.yml`)
  - Cache: Solid Cache
  - Views: View Components
  - CSS: Tailwind CSS (mobile-first)
  - Interactivity: Hotwire (Turbo + Stimulus)
  - Type Checking: Sorbet (`typed: strict` where possible); RBI files in `sorbet/`, generated via `bin/tapioca dsl`
  - File Storage: Active Storage
  - Authorization: Action Policy (policy objects per domain model)

  ## Architecture
  - **Service-layer boundary** — controllers and views interact exclusively through service objects. Models are never accessed directly from the web layer.
  - **Policy-enforced authorization** — all access control is enforced by Action Policy policy objects. Services call `authorize!` at the top of every call path; controllers call `authorized_scope` to build queries.
  - **Skinny controllers** — controllers handle HTTP concerns only: params, session, redirects, status codes. No business logic lives in a controller.
  - **Services receive domain objects only** — services accept model instances and scalar values. They never receive `session`, `cookies`, `params`, `request`, or `response`.
  - **Verb-named service objects** — POROs named as verbs (`CreateProject`, `CancelSubscription`). Each includes the `Service` concern which auto-generates a `::Job` for async execution.
  - **Service::Result contract** — services return `Service::Result` for both success and validation failure. `result.ok?` indicates success; `result.value` carries the record. Authorization failures raise `ActionPolicy::Unauthorized`, not a result.
  - **Sorbet everywhere** — every Ruby file carries a `# typed:` sigil.
  - **Packwerk package boundaries** — domain code lives in `packs/` packages forming a strict acyclic dependency graph. Document each pack and its dependencies here as they are created.

  ## Project Structure
  - Views: `app/views/` as ViewComponents classes; components in `app/components/`
  - Controllers render ViewComponents directly: `render Views::Projects::New.new(project: @project)`
  - Service objects: `app/services/` (or `packs/<domain>/app/services/`)
  - Policy objects: `app/policies/` (or `packs/<domain>/app/policies/`), one per model
  - `db/schema.rb` — current database schema

  ## Key Conventions
  - Tailwind utility classes, mobile-first
  - Rubocop Rails Omakase style
  - `frozen_string_literal: true` in all Ruby files
  - Sorbet type signatures (`typed: strict` when possible); run `srb tc` to verify
  - Minitest for testing (`test/` directory); run with `bin/rails test`
  - Pivotal Labs coding style: small methods, small classes, intention-revealing names, tell don't ask, composition over inheritance, skinny controllers, service objects for orchestration

